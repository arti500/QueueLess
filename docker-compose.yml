services:
  postgres:
    image: postgres:16-alpine
    container_name: queueless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueless_db
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_dev_password
    ports:
      - "5433:5432"
    volumes:
      - queueless_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  queueless_pgdata:
